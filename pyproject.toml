[project]
name = "aircraft-damage-classification"
version = "0.1.0"
description = "Classify aircraft damage with VGG16, describe with BLIP, report with a local LLM."
requires-python = "==3.12.*"
dependencies = [
    "tensorflow-cpu==2.17.1",
    "numpy>=1.26,<2",
    "pillow==10.1.0",
    "matplotlib==3.9.2",
    "transformers==4.44.2",
    "torch==2.4.1+cpu",
    "httpx==0.27.2",
    "streamlit==1.39.0",
]

[dependency-groups]
dev = ["pytest==8.3.3", "ruff==0.6.9", "mypy==1.11.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aircraft_damage"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "TID", "ANN", "D"]
ignore = ["D203", "D213", "ANN101", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D101", "D102", "ARG001", "ARG002"]
"scripts/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tensorflow.*", "keras.*", "transformers.*", "torch.*", "matplotlib.*", "streamlit.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs model downloads, network, or real training"]
